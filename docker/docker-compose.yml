services:
  app:
    build:
      context: ../
      dockerfile: docker/php/Dockerfile
    container_name: evolix_saas_app
    restart: unless-stopped
    working_dir: /var/www/html/backend
    volumes:
      - ../backend:/var/www/html/backend
      - ../docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: evolix_saas_platform
      DB_USERNAME: evolix_user
      DB_PASSWORD: evolix_secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AWS_ENDPOINT: http://minio:9000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - evolix_network

  queue_worker:
    build:
      context: ../
      dockerfile: docker/php/Dockerfile
    container_name: evolix_saas_queue_worker
    restart: unless-stopped
    working_dir: /var/www/html/backend
    command: php artisan queue:work --queue=critical,finance,default,messaging,reports,imports,maintenance --tries=3
    volumes:
      - ../backend:/var/www/html/backend
      - ../docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: evolix_saas_platform
      DB_USERNAME: evolix_user
      DB_PASSWORD: evolix_secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - app
      - mysql
      - redis
    networks:
      - evolix_network

  web:
    image: nginx:alpine
    container_name: evolix_saas_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../backend:/var/www/html/backend
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - evolix_network

  mysql:
    image: mysql:8.0
    container_name: evolix_saas_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: evolix_saas_platform
      MYSQL_USER: evolix_user
      MYSQL_PASSWORD: evolix_secret_password
    volumes:
      - evolix_mysql_data:/var/lib/mysql
      - ../docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - evolix_network

  redis:
    image: redis:7-alpine
    container_name: evolix_saas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - evolix_redis_data:/data
    networks:
      - evolix_network

  minio:
    image: minio/minio:latest
    container_name: evolix_saas_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_password
    command: server /data --console-address ":9001"
    volumes:
      - evolix_minio_data:/data
    networks:
      - evolix_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: evolix_saas_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - evolix_network

networks:
  evolix_network:
    driver: bridge

volumes:
  evolix_mysql_data:
  evolix_redis_data:
  evolix_minio_data:
